# DRAFT, team to review.
# Clinic vertical config. Written from context/mvp.md. Real per-clinic values (hours,
# chain, reminder time) live in tenant config, decided via context/go-live-checklist.md.

name: clinic
status: draft
version: 0.1.0

labels:
  resource: "Doctor"
  resource_plural: "Doctors"
  contact: "Patient"
  booking: "Appointment"
  tenant: "Clinic"

# Shown on the public test page as "Try saying" (contracts.md section 6.1, GET /api/try/{public_id}).
try_saying:
  - "Consultation fee kitni hai?"
  - "Kal shaam 5 baje appointment chahiye."
  - "Sunday ko clinic khula hai?"
  - "Mera kal wala appointment cancel kar dijiye."

languages:
  default: hi-en
  supported: [hi-en, en, hi]

modules: [bookings]
tools: [get_clinic_info, find_slots, book, find_booking, reschedule, cancel, create_callback, escalate, transfer, log_call_outcome]
onboarding:                  # create-business form defaults (ADR-0038); the owner checks and edits
  slot_min: 15
  sessions: [["10:00", "14:00"], ["17:00", "20:00"]]
  closed_weekdays: [6]
  services:
    - {name: Consultation, fee: "₹300"}
  emergency_instruction: >-
    Agar saans lene ya nigalne mein dikkat hai, sujan tezi se badh rahi hai, ya khoon ruk nahi raha,
    to turant nazdeeki hospital ki emergency mein jaaiye ya 108 par call kijiye.

booking:
  default_slot_min: 15       # VERIFY with the pilot clinic
  offer_slots: 3
  allow_resource_choice: true
  min_lead_min: 30
  max_days_ahead: 30
  sources: [phone, whatsapp, walk_in]

whatsapp:
  commands: [block_day, block_range, set_hours, query_today]
  confirm_words: [haan, ha, yes, ok]
  reject_words: [nahi, na, no]
  preview_expiry_min: 30

reminders:
  enabled: true
  hours_before: 18           # placeholder; the clinic sets this at go-live
  opt_out_words: [stop, "band karo"]

alerts:
  repeat_minutes: 5

ops:
  silence_hours: 3

knowledge:
  answer_only_approved: true

safety:
  guard: required            # C5 — never optional for clinics
  escalation_rules: escalation-rules.yaml
  prompt: agent-prompt.md
