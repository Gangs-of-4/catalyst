# Vertical config — copy this folder to verticals/<name>/ to start a new vertical.
# Loaded and validated by backend/src/verticals/. Core code never branches on vertical (ADR-0033).
# Keep keys stable; add new keys to this template first so every vertical stays valid.

name: _template            # folder name, lowercase, underscores
status: draft              # draft | active
version: 0.1.0

labels:                    # words the agent, web app and WhatsApp use
  resource: "Resource"     # e.g. "Doctor", "Teacher"
  resource_plural: "Resources"
  contact: "Customer"      # e.g. "Patient", "Student"
  booking: "Appointment"
  tenant: "Business"

languages:
  default: hi-en           # hi-en (Hinglish) | en | hi
  supported: [hi-en, en, hi]

booking:
  default_slot_min: 15
  offer_slots: 3           # nearest free slots offered (C4)
  allow_resource_choice: true
  min_lead_min: 30         # earliest bookable time from now
  max_days_ahead: 30
  sources: [phone, whatsapp, walk_in]

whatsapp:
  commands: [block_day, block_range, set_hours, query_today]
  confirm_words: [haan, ha, yes, ok]
  reject_words: [nahi, na, no]
  preview_expiry_min: 30

reminders:
  enabled: true
  hours_before: 18         # clinic sets the real value at go-live
  opt_out_words: [stop, "band karo"]

alerts:
  repeat_minutes: 5        # urgent alerts repeat until marked done

ops:
  silence_hours: 3         # weekday hours with no calls before an ops alert

knowledge:
  answer_only_approved: true   # C3 — never answer outside approved entries

safety:
  guard: required          # required | optional — clinic must be required
  escalation_rules: escalation-rules.yaml
  prompt: agent-prompt.md
