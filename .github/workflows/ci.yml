# Backend CI: lint/format, provider boundary, tests.
# mypy is not a gate yet: coding-rules.md makes `mypy --strict` a Post-MVP merge gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Ruff & Black
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tools (pinned)
        run: pip install ruff==0.17.4 black==26.10.1

      - name: Ruff
        run: ruff check --config pyproject.toml --output-format=github . ../scripts/check_provider_boundary.py

      - name: Black
        run: black --check --diff --config pyproject.toml . ../scripts/check_provider_boundary.py

  boundary:
    name: Provider boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No vendor SDKs or API hosts outside backend/src/providers/
        run: python ../scripts/check_provider_boundary.py

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q
