# CI: backend lint/format, provider boundary and tests; frontend lint, types, tests and build.
# mypy is not a gate yet: coding-rules.md makes `mypy --strict` a Post-MVP merge gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Ruff & Black
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tools (pinned)
        run: pip install ruff==0.17.4 black==26.10.1

      - name: Ruff
        run: ruff check --config pyproject.toml --output-format=github . ../scripts/check_provider_boundary.py

      - name: Black
        run: black --check --diff --config pyproject.toml . ../scripts/check_provider_boundary.py

  boundary:
    name: Provider boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No vendor SDKs or API hosts outside backend/src/providers/
        run: python ../scripts/check_provider_boundary.py

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q

  # Same suite on Postgres, the production database (ADR-0039). Catches SQL that only SQLite accepts.
  test-postgres:
    name: Pytest (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalyst
          POSTGRES_PASSWORD: catalyst
          POSTGRES_DB: catalyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; tests drop its public schema before every test.
      TEST_DATABASE_URL: postgresql://catalyst:catalyst@localhost:5432/catalyst_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest on Postgres
        run: python -m pytest -v

  # The React app (ADR-0042). Same Node major as the deploy; `node build.mjs` is the exact build Vercel runs.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Contrast (WCAG AA tokens)
        run: npm run check:contrast

      - name: Unit tests
        run: npm test

      - name: Build (as Vercel does)
        working-directory: frontend
        run: node build.mjs
