# Deploy frontend/ to Vercel production (ADR-0036).
# The repo is public, so Vercel Hobby deploys any teammate's commit with its real Git
# metadata. Keep the repo public: Hobby can't deploy a private org repo (ADR-0036).
# Runs only after the CI workflow succeeds on a push to main, and deploys exactly the
# commit CI tested. workflow_run can't filter by path, so every merge to main deploys.
# Manual runs (workflow_dispatch) are allowed from main as an escape hatch.
name: Deploy frontend (Vercel)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel production
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The commit CI tested (workflow_run), or the current main (manual run).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pull Vercel production settings and env vars
        run: npx --yes vercel@65.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      # vercel.json can't read env vars, so write the /api and /healthz rewrites to the backend
      # (NEXT_PUBLIC_API_URL, saved by the pull above) into it before building (ADR-0041).
      - name: Add backend rewrites
        run: node frontend/configure-vercel.mjs

      - name: Build
        run: npx --yes vercel@65.1.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        id: deploy
        run: |
          url="$(npx --yes vercel@65.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record deployed commit
        run: |
          {
            echo "### Vercel production deployment"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
